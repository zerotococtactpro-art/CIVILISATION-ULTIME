name: Build Civilisation Ultimate

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build
        run: gradle --no-daemon clean build
      - name: Verify
        run: ls -lah build/libs/*.jar
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CivilisationUltimate-Java25-Fixed2
          path: build/libs/*.jar
          if-no-files-found: error
